# ============================================================
# 企业写手 Com-Writer 配置文件（示例）
# 复制为 config.ini 并填写实际值
# ============================================================

[系统]
行业 = 工程建设
项目名称 = 企业写手
日志级别 = INFO

[智谱]
api_key = ${ZHIPU_API_KEY}
免费模型 = glm-4-flashx,glm-4-flash,glm-4-airx,glm-4-air
付费模型 = glm-5.2
请求超时秒 = 120

[DeepSeek]
api_key = ${DEEPSEEK_API_KEY}
模型 = deepseek-chat
请求超时秒 = 60

[内网爬取]
启用 = false
地址 = http://your-intranet-host/path/
token = ${INTRANET_TOKEN}
输出目录 = data/crawled

[本地输入]
启用 = false
输入目录 =
文件格式 = .docx,.pdf,.txt,.md
递归扫描 = true

[会议纪要]
模板路径 = data/templates/meeting_minutes_template.docx
输出目录 = data/output
原始记录目录 = data/input
质量自审轮次 = 3
质量阈值 = 80
使用付费模型 = false

[通知]
企微webhook = ${WECOM_WEBHOOK_URL}
关键节点通知 = true
完成通知 = true
失败告警 = true

[安全]
禁止删除 = true
调试模式 = false

[高级]
启用恢复 = true
进度文件 = .com-writer-state.json
